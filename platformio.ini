; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    mikalhart/TinyGPSPlus
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    adafruit/Adafruit GFX Library@^1.11.9
    h2zero/NimBLE-Arduino@2.1.0
  ;  mathieucarbou/ESPAsyncWebServer@^3.3.23  ; ESPAsyncWebServer is not compatible with the latest AsyncTCP, so we will use an older version of AsyncTCP instead
   ESP32Async/AsyncTCP@^3.3.8


build_src_filter = +<*> -<WiFi/old/>

; No manual include paths needed
; build_flags =
;     -I.pio/libdeps/esp32dev/NimBLE-Arduino/src -D CONFIG_ASYNC_TCP_RUNNING_CORE=1

